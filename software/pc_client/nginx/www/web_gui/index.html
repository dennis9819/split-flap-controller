<!doctype html>
<html lang="en">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="color-scheme" content="light dark">
    <link rel="stylesheet" href="css/pico.min.css">
    <link rel="stylesheet" href="css/sfc.css">
    <script type="text/javascript" src="js/sfc.js"></script>
    <script type="text/javascript" src="js/webgui.js"></script>
    <title>SplitFlap Controller!</title>
    <link rel="icon" type="image/png" href="/favicon.png"/>

    <link rel="apple-touch-icon" href="/favicon.png">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name='viewport' content='initial-scale=1, viewport-fit=cover' />

</head>8

<body>
    <!-- Dialogs -->
    <dialog id="change_address">
        <article>
            <h2>Change address</h2>
            <section>
                <form id="form_change_calibration">
                    <label>
                        Current address:
                        <input id="form_change_address_old" name="addr_old" type="number" placeholder="Current Address"
                            value="0" />
                        New address:
                        <input id="form_change_address_new" name="addr_new" type="number" placeholder="New Address" />
                    </label>
                </form>
                <footer>
                    <button class="secondary btn_cancel">
                        Cancel
                    </button>
                    <button class="btn_confirm">Confirm</button>
                </footer>
        </article>
    </dialog>

    <dialog id="dialog_add_device">
        <article>
            <h2>Add device</h2>
            <section>
                <form id="form_change_calibration">
                    <label>
                        Device address:
                        <input id="form_add_device_addr" name="addr_old" type="number" placeholder="Current Address"
                            value="0" />
                        Device position:
                        <fieldset role="group">
                            <input id="form_add_device_x" name="x" type="x" placeholder="Position X" value="0" />
                            <input id="form_add_device_y" name="y" type="y" placeholder="Position Y" value="0" />
                        </fieldset>
                    </label>
                </form>
                <footer>
                    <button class="secondary btn_cancel">
                        Cancel
                    </button>
                    <button class="btn_confirm">Confirm</button>
                </footer>
        </article>
    </dialog>

    <dialog id="dialog_change_calibration">
        <article>
            <h2>Change calibration</h2>
            <section>
                <form id="form_change_calibration">
                    <label>
                        New calibration data (default 1400):
                        <input id="form_change_calibration_data" name="calibration" type="number"
                            placeholder="Calibration Value" value="1400" />
                    </label>
                </form>
                <footer>
                    <button class="secondary btn_cancel">
                        Cancel
                    </button>
                    <button class="btn_confirm">Confirm</button>
                </footer>
        </article>
    </dialog>
    <!-- Header (Title and Menu) -->
    <header class="container">
        <nav>
            <ul>
                <li>
                    <img src="favicon.png" alt="Logo" width="64" height="64" />
                </li>
                <li><strong>SplitFlap</strong></li>
            </ul>
            <ul>
                <li><a onclick="change_view('view_display')" class="secondary">Display</a></li>
                <li>
                    <details class="dropdown" id="menu_dropdown">
                        <summary>
                            Configuration
                        </summary>
                        <ul dir="rtl">
                            <li><a onclick="change_view('view_conf_modules')">Modules</a></li>
                            <li><a onclick="change_view('view_storage')">Storage</a></li>
                        </ul>
                    </details>
                </li>
            </ul>
        </nav>
    </header>
    <!-- Content -->
    <main class="container">
        <div id="message_container" style="width: 100%;" class="notification-container">
            <template id="notification">
                <div class="notification">
                    <p>Notification</p>
                </div>
            </template>

        </div>


        <div id="view_display"><!-- Main View : print -->
            <h1>Display Something!</h1>
            <div id="form_display">
                <fieldset>
                    <label>
                        Text to display:
                        <input id="form_display_str" name="text" placeholder="Text" oninput="render_str_len()" />
                        <small id="form_display_str_len">Length: 0 chars</small>
                    </label>
                    <label>
                        Position on display:
                        <fieldset role="group">
                            <input id="form_display_x" name="x" type="x" placeholder="Position X" value="0" />
                            <input id="form_display_y" name="y" type="y" placeholder="Position Y" value="0" />
                        </fieldset>
                    </label>
                    <label>
                        Display Mode:
                        <select id="form_display_mode" name="mode" required>
                            <option selected disabled value="">
                                Select display mode
                            </option>
                            <option value="0">Full Rotation</option>
                            <option value="1">Direct</option>
                            <option value="2">Sync</option>
                        </select>
                    </label>
                </fieldset>

                <input type="button" onClick="btn_display()" value="Display" />
                <input type="button" onClick="btn_clear()" value="Clear screen" />

                <hr>
                <h3>Favorites and History</h3>
                <div role="group">
                    <table>
                        <thead>
                            <tr>
                                <th scope="col">Text</th>
                                <th scope="col">Position</th>
                                <th scope="col">Mode</th>
                                <th scope="col"></th>
                            </tr>
                        </thead>
                        <template id="recall_list_template">
                            <tr>
                                <td>
                                    <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" fill="currentColor"
                                        class="bi bi-heart-fill" viewBox="0 0 16 16">
                                        <path fill-rule="evenodd"
                                            d="M8 1.314C12.438-3.248 23.534 4.735 8 15-7.534 4.736 3.562-3.248 8 1.314" />
                                    </svg>
                                    <p class="recall_text" style="display: inline;"></p>
                                </td>
                                <td class="recall_position">0,0</td>
                                <td class="recall_mode">Full Rotation</td>
                                <td>
                                    <button type="button" class="btn_recall_display">
                                        Display
                                    </button>
                                    <button type="button" class="btn_recall_load">
                                        Recall
                                    </button>
                                    <button type=“button” class="btn_recall_fav">
                                        <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20"
                                            fill="currentColor" class="bi bi-bookmark-heart" viewBox="0 0 16 16">
                                            <path fill-rule="evenodd"
                                                d="M8 4.41c1.387-1.425 4.854 1.07 0 4.277C3.146 5.48 6.613 2.986 8 4.412z" />
                                            <path
                                                d="M2 2a2 2 0 0 1 2-2h8a2 2 0 0 1 2 2v13.5a.5.5 0 0 1-.777.416L8 13.101l-5.223 2.815A.5.5 0 0 1 2 15.5zm2-1a1 1 0 0 0-1 1v12.566l4.723-2.482a.5.5 0 0 1 .554 0L13 14.566V2a1 1 0 0 0-1-1z" />
                                        </svg>
                                    </button>
                                    <button type=“button” class="btn_recall_fav_remove">
                                        <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20"
                                            fill="currentColor" class="bi bi-bookmark-heart-fill" viewBox="0 0 16 16">
                                            <path
                                                d="M2 15.5a.5.5 0 0 0 .74.439L8 13.069l5.26 2.87A.5.5 0 0 0 14 15.5V2a2 2 0 0 0-2-2H4a2 2 0 0 0-2 2zM8 4.41c1.387-1.425 4.854 1.07 0 4.277C3.146 5.48 6.613 2.986 8 4.412z" />
                                        </svg>
                                    </button>

                                </td>
                            </tr>
                        </template>

                        <tbody id="recall_list">

                        </tbody>
                    </table>
                </div>
            </div>
        </div>
        <div id="view_conf_modules" style="display: none;">
            <h1>Module config</h1>
            <div role="group">
                <button id="btn_refresh" onClick="load_module_conf()">Refresh</button>

            </div>

            <template id="module_list_template">
                <details name="example" open>
                    <summary class="module_header"></summary>
                    <table>
                        <thead>
                            <tr>
                                <th scope="col">Property</th>
                                <th scope="col">Value</th>
                                <th scope="col"></th>
                            </tr>
                        </thead>
                        <tbody>
                            <tr>
                                <th scope="row">Module ID</th>
                                <td>12,104</td>
                                <td></td>
                            </tr>
                            <tr>
                                <th scope="row">Address</th>
                                <td>4,880</td>
                                <td></td>
                            </tr>
                            <tr>
                                <th scope="row">Calibration</th>
                                <td>12,104</td>
                                <td><button>Set</button></td>
                            </tr>
                            <tr>
                                <th scope="row">Status</th>
                                <td>12,104</td>
                                <td></td>
                            </tr>
                            <tr>
                                <th scope="row">Rotations</th>
                                <td>12,104</td>
                                <td></td>
                            </tr>
                            <tr>
                                <th scope="row">Position</th>
                                <td>12,104</td>
                                <td></td>
                            </tr>
                            <tr>
                                <th scope="row">Motor On</th>
                                <td>12,104</td>
                                <td><input name="power" type="checkbox" role="switch" /></td>
                            </tr>
                            <tr>
                                <th scope="row">Voltage</th>
                                <td>12,104</td>
                                <td></td>
                            </tr>
                            <tr>
                                <th scope="row">Current flap</th>
                                <td>12,104</td>
                                <td></td>
                            </tr>
                            <tr>
                                <th scope="row">Error flags</th>
                                <td>-</td>
                                <td></td>
                            </tr>
                            <tr>
                                <th scope="row">Firmware</th>
                                <td>-</td>
                                <td></td>
                            </tr>

                        </tbody>

                    </table>
                    <div role="group">
                        <button class="btn_reset">Reset</button>
                        <button class="btn_remove secondary pico-background-red-500">Remove</button>
                    </div>
                </details>
                <hr />
            </template>

            <div id="module_list"></div>
            <div role="group">
                <button class="btn_add" onclick="display_dialog_add_device()">Add Module</button>
                <button class="btn_assign" onclick="display_dialog_change_address()">Assign Address</button>
            </div>
        </div>
        <div id="view_storage" style="display: none;"><!-- Main View : print -->
            <h1>Load/Save Config!</h1>
            <div role="group">
                <button class="btn_load" onclick="btn_load()">Load Config</button>
            </div>
            <div role="group">
                <button class="btn_save" onclick="btn_save()">Safe Config</button>
            </div>
        </div>


    </main>
    <!-- Footer -->
    <footer class="container">
        <small>
            Designed and developed by <a target="_blank" rel="noopener noreferrer"
                href="https://www.dennisgunia.de">Dennis Gunia</a> |
            <a target="_blank" rel="noopener noreferrer" href="https://github.com/dennis9819/split-flap-controller">
                Source code
            </a>
        </small>
    </footer>

</body>

</html>
